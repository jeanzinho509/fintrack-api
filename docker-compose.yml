services:
  postgres:
    image: postgres:17
    platform: linux/amd64
    container_name: fintrack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack

    ports:
      - "5432:5432"

    volumes:
      - fintrack_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fintrack_postgres_data: